# TrialGPTBot Enterprise — docker-compose
# One-command startup: `docker compose up -d`
#
# Pulls the image from GHCR if you've already released a tag, OR builds locally
# from the Dockerfile if you run `docker compose up --build`.

services:
  trialgptbot:
    # Use the GHCR image built by the release workflow
    image: ghcr.io/testdemoqwenai2025-creator/trialgptbotdemo2:latest
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: trialgptbot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./db/custom.db
      # Add your own env vars here:
      # - OPENAI_API_KEY=...
      # - NEXTAUTH_SECRET=...
      # - NEXTAUTH_URL=http://localhost:3000
    volumes:
      # Persist the SQLite DB across container restarts
      - trialgptbot-db:/app/db
      # Optional: mount logs directory
      - trialgptbot-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  trialgptbot-db:
  trialgptbot-logs:
