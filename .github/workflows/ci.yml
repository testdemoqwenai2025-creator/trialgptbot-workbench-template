# CI — runs on every push and pull request to main
# Lints, type-checks (best-effort), installs deps, generates Prisma client, and
# builds the Next.js standalone output. Caches bun deps + Next.js build cache.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"

jobs:
  build:
    name: Lint + Build (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun lockfile
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock', 'src/**', 'package.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Lint
        run: bun run lint
        continue-on-error: true  # demo codebase has existing lint warnings

      - name: Build (Next.js standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          echo "✓ standalone build complete"
          du -sh .next/standalone/

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-${{ github.sha }}
          path: |
            .next/standalone
            prisma
            db
          retention-days: 14
          compression-level: 6
