# Release — runs on tag push matching v*
# Produces three artifacts:
#   1. A versioned tarball (trialgptbot-vX.Y.Z.tar.gz) — the "binary bundle"
#      that can be downloaded, extracted, and run with `bun server.js`.
#   2. A Docker image pushed to GHCR (ghcr.io/<owner>/trialgptbot:vX.Y.Z).
#   3. A GitHub Release with the tarball + checksum attached.
#
# The Docker image is the easiest "binary to be cloned" — anyone can pull it
# and run a complete copy of the app in 30 seconds:
#   docker run -p 3000:3000 ghcr.io/<owner>/trialgptbot:latest

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.3.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    name: Build tarball + Docker image + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Build standalone
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify build
        run: |
          test -f .next/standalone/server.js
          echo "✓ standalone build verified"

      # ============================================================
      # 1. TARBALL — the "binary bundle"
      # ============================================================
      - name: Package tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="/tmp/trialgptbot-${VERSION}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Core runtime
          cp -r .next/standalone "$STAGE/standalone"
          cp -r prisma "$STAGE/prisma"
          cp -r db "$STAGE/db"

          # Docs + entrypoint
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/"
          mkdir -p "$STAGE/docs"
          cp -r docs/* "$STAGE/docs/" 2>/dev/null || true

          # Entrypoint script
          cat > "$STAGE/run.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          export NODE_ENV=production
          export PORT="${PORT:-3000}"
          export DATABASE_URL="${DATABASE_URL:-file:./db/custom.db}"
          exec bun standalone/server.js
          EOF
          chmod +x "$STAGE/run.sh"

          # Manifest
          cat > "$STAGE/MANIFEST.md" <<EOF
          # TrialGPTBot Enterprise — $VERSION
          Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Commit: ${{ github.sha }}

          ## Quick start
          \`\`\`bash
          tar xzf trialgptbot-$VERSION.tar.gz
          cd trialgptbot-$VERSION
          ./run.sh
          # → http://localhost:3000
          \`\`\`

          ## Requirements
          - Bun >= 1.3.x (or Node.js >= 22 with \`node standalone/server.js\`)
          - ~250MB disk for runtime + SQLite DB

          ## Configuration
          - \`PORT\` — HTTP port (default 3000)
          - \`DATABASE_URL\` — SQLite path (default \`file:./db/custom.db\`)
          EOF

          # Compress
          cd /tmp
          tar czf "trialgptbot-${VERSION}.tar.gz" "trialgptbot-${VERSION}"
          ls -lh "trialgptbot-${VERSION}.tar.gz"

          # SHA256
          sha256sum "trialgptbot-${VERSION}.tar.gz" > "trialgptbot-${VERSION}.tar.gz.sha256"
          cat "trialgptbot-${VERSION}.tar.gz.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: trialgptbot-${{ steps.ver.outputs.version }}-tarball
          path: |
            /tmp/trialgptbot-${{ steps.ver.outputs.version }}.tar.gz
            /tmp/trialgptbot-${{ steps.ver.outputs.version }}.tar.gz.sha256
          retention-days: 90

      # ============================================================
      # 2. DOCKER IMAGE — push to GHCR
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version_num }}
          labels: |
            org.opencontainers.image.title=TrialGPTBot Enterprise
            org.opencontainers.image.description=Clinical trial reviewer workbench (demo build)
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # ============================================================
      # 3. GITHUB RELEASE — attach tarball + checksum
      # ============================================================
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            BODY=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            BODY=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          {
            echo "body<<EOF"
            echo "## TrialGPTBot Enterprise — ${{ steps.ver.outputs.version }}"
            echo ""
            echo "### What's in this release"
            echo ""
            echo "- **Tarball**: \`trialgptbot-${{ steps.ver.outputs.version }}.tar.gz\`"
            echo "- **Docker image**: \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version_num }}\`"
            echo "- **Docker image**: \`ghcr.io/${{ env.IMAGE_NAME }}:latest\`"
            echo ""
            echo "### Quick start (tarball)"
            echo ""
            echo '```bash'
            echo "curl -L -o trialgptbot.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/trialgptbot-${{ steps.ver.outputs.version }}.tar.gz"
            echo "tar xzf trialgptbot.tar.gz"
            echo "cd trialgptbot-${{ steps.ver.outputs.version }}"
            echo "./run.sh  # → http://localhost:3000"
            echo '```'
            echo ""
            echo "### Quick start (Docker)"
            echo ""
            echo '```bash'
            echo "docker run -d --name trialgptbot -p 3000:3000 \\"
            echo "  ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version_num }}"
            echo '```'
            echo ""
            echo "### Changes since ${PREV_TAG:-start of history}"
            echo ""
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: TrialGPTBot ${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: |
            /tmp/trialgptbot-${{ steps.ver.outputs.version }}.tar.gz
            /tmp/trialgptbot-${{ steps.ver.outputs.version }}.tar.gz.sha256
          generate_release_notes: false
